name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    uses: ./.github/workflows/validate.yml
  draft:
    name: Create release draft
    needs: validate
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-assets
          path: release-assets
      - name: Verify and create draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd release-assets
          sha256sum -c SHA256SUMS
          cp ../CHANGELOG.md release-notes.md
          printf '\nBuild/source provenance is attached. Hardware acceptance is the historical 2026-11-14 report; CI does not test S805 hardware.\n' >> release-notes.md
          gh release create "$GITHUB_REF_NAME" ./*.tar.gz SHA256SUMS PROVENANCE.json \
            --verify-tag --draft --prerelease --title "$GITHUB_REF_NAME" --notes-file release-notes.md
