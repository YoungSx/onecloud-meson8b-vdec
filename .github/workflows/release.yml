name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    uses: ./.github/workflows/validate.yml
  draft:
    name: Create release draft
    needs: validate
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-assets
          path: release-assets
      - name: Verify and create draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd release-assets
          sha256sum -c SHA256SUMS
          cp ../CHANGELOG.md release-notes.md
          printf '\nBuild/source provenance is attached. Hardware acceptance is the historical 2026-11-14 report; CI does not test S805 hardware.\n' >> release-notes.md
          gh release create "$GITHUB_REF_NAME" ./*.tar.gz SHA256SUMS PROVENANCE.json \
            --verify-tag --draft --prerelease --title "$GITHUB_REF_NAME" --notes-file release-notes.md
