name: Validate

on:
  workflow_call:

permissions:
  contents: read

jobs:
  host:
    name: Host checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install host dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential shellcheck
      - name: Tests, sanitizers and documentation
        run: make test
      - name: Validate workflow syntax
        run: |
          GOBIN="$RUNNER_TEMP/ci-tools" go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.7
          "$RUNNER_TEMP/ci-tools/actionlint"
      - name: Verify firmware is unchanged
        run: git diff --exit-code -- firmware

  arm:
    name: ARM build and packages
    needs: host
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      JOBS: '4'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install cross-build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-11-arm-linux-gnueabihf g++-11-arm-linux-gnueabihf \
            gcc-11-plugin-dev-arm-linux-gnueabihf build-essential flex bison bc \
            libssl-dev libelf-dev device-tree-compiler kmod curl xz-utils bzip2 pkg-config
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            sources/*.tar.xz
            sources/ffmpeg/*.tar.xz
            sources/v4l-utils/*.tar.bz2
            sources/vendor
          key: upstream-${{ runner.os }}-${{ hashFiles('firmware/sources.json', 'scripts/build-kernel.sh', 'scripts/build-ffmpeg-test.sh', 'scripts/build-v4l2-ctl.sh') }}
      - name: Cross-build and package
        run: |
          mkdir -p build/logs
          set -o pipefail
          python3 scripts/extract-firmware.py --fetch 2>&1 | tee build/logs/firmware.log
          bash scripts/build-kernel.sh 2>&1 | tee build/logs/kernel.log
          bash scripts/build-ffmpeg-test.sh 2>&1 | tee build/logs/ffmpeg.log
          bash scripts/build-v4l2-ctl.sh 2>&1 | tee build/logs/v4l2-ctl.log
          git diff --exit-code
          version=v0.0.0-ci
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then version=$GITHUB_REF_NAME; fi
          bash scripts/package-release.sh "$version" build/release 2>&1 | tee build/logs/package.log
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-assets
          path: |
            build/release/*.tar.gz
            build/release/SHA256SUMS
            build/release/PROVENANCE.json
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: build-logs
          path: build/logs/
          if-no-files-found: ignore
          retention-days: 14
